name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Shell script check
        run: shellcheck deploy.sh

      - name: HTML check
        run: npx --yes htmlhint@1.1.4 index.html
