# GitLab CI version of the same pipeline, for comparison with GitHub Actions
stages:
  - lint
  - deploy

lint:
  stage: lint
  image: node:20
  script:
    - npx --yes htmlhint@1.1.4 index.html

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$VM_USER@$VM_HOST" "bash ~/azure-deploy-demo/deploy.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
